[package]
name = "light-robot-core-embeded"
version = "0.1.0"
edition = "2021"
resolver = "2"
rust-version = "1.81"

[[bin]]
name = "light-robot-core-embeded"
harness = false # do not use the built in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice and they don't increase the size on Flash
opt-level = "z"

[features]
default = ["std", "embassy", "esp-idf-svc/native"]

pio = ["esp-idf-svc/pio"]
std = ["alloc", "esp-idf-svc/binstart", "esp-idf-svc/std"]
alloc = ["esp-idf-svc/alloc"]
nightly = ["esp-idf-svc/nightly"]
experimental = ["esp-idf-svc/experimental"]
embassy = ["esp-idf-svc/embassy-sync", "esp-idf-svc/critical-section", "esp-idf-svc/embassy-time-driver"]

[dependencies]
light-robot-core-api = {path = "../light-robot-core-api"}

log = { version = "0.4.22", default-features = false }
esp-idf-svc = { version = "0.49.1", features = ["alloc"]}
esp-idf-hal = "0.44.1"
esp-idf-sys = "0.35.0"

embedded-hal = "1.0.0"

ws2812-esp32-rmt-driver = "0.9.0"
smart-leds = "0.4.0"
smart-leds-trait = "0.3.0"
enumset = "1.1.5"
anyhow = "1.0.88"
heapless = "0.8.0"
serde_json = "1.0.128"
bincode = { version = "2.0.0-rc.3", default-features = false, features = ["derive", "alloc"]}
include_dir = "0.7.3"
shared-bus = { version="0.3.0", features = ["std"]}
max170xx = "1.0.0"
bmp280-ehal = "0.0.6"

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1.2" }

[build-dependencies]
embuild = "0.32.0"
anyhow = "1.0.88"
trunk-build-time = "0.17.3"
async-std = { version = "1.13.0", features = ["attributes", "tokio1"] }
tokio = "1.40.0"
flate2 = "1.0.33"