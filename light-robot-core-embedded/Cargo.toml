[package]
name = "light-robot-core-embeded"
version = "0.1.0"
edition = "2021"
resolver = "2"
rust-version = "1.81"

[[bin]]
name = "light-robot-core-embeded"
harness = false # do not use the built in cargo test harness -> resolve rust-analyzer errors

[profile.release]
# ESP Rust 1.93.0.0 / LLVM 20 predates the Xtensa LLVM 21 PCREL_WRAPPER
# regression, so normal size optimization is safe again.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
debug = true    # Symbols are nice and they don't increase the size on Flash
# The current Xtensa LLVM backend crashes while optimizing serde_json at `z`.
opt-level = 0

[features]
default = ["std", "esp-idf-svc/native"]

pio = ["esp-idf-svc/pio"]
std = ["alloc", "esp-idf-svc/binstart", "esp-idf-svc/std"]
alloc = ["esp-idf-svc/alloc"]
nightly = ["esp-idf-svc/nightly"]
experimental = ["esp-idf-svc/experimental"]
embassy = ["esp-idf-svc/embassy-sync", "esp-idf-svc/critical-section", "esp-idf-svc/embassy-time-driver"]

[dependencies]
light-robot-core-api = {path = "../light-robot-core-api"}
bldc-servo-protocol = { git = "https://github.com/PositiveAltitude/BLDC-servo-v1.git", rev = "8c5e7bbc673a042bdb1d58115d9f2eda6bc9da41", package = "bldc-servo-protocol" }

log = { version = "0.4.34", default-features = false }
esp-idf-svc = { version = "0.52.1", features = ["alloc"]}
esp-idf-hal = "0.46.2"
esp-idf-sys = "0.37.2"

embedded-hal = "1.0.0"

# The 0.15 prerelease is required for compatibility with esp-idf-hal 0.46.
# Legacy RMT keeps the driver Send for the HTTP command handler's LED updates.
ws2812-esp32-rmt-driver = { version = "0.15.0-alpha.1", features = ["rmt-legacy"] }
enumset = "1.1.14"
anyhow = "1.0.104"
heapless = "0.9.3"
serde_json = "1.0.149"
include_dir = "0.7.4"
max170xx = "1.0.0"

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1.2" }

[build-dependencies]
embuild = "0.33.4"
anyhow = "1.0.104"
trunk-build-time = "0.17.3"
tokio = "1.53.1"
flate2 = "1.1.10"
